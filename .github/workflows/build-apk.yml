name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar gradle-wrapper.jar
        run: |
          if [ ! -f mobile/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar FALTANDO!"
            exit 1
          fi
          echo "gradle-wrapper.jar OK ($(stat -c%s mobile/gradle/wrapper/gradle-wrapper.jar) bytes)"

      - name: Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties
          cat mobile/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug --stacktrace

      - name: Listar APKs gerados
        run: |
          echo "=== APKs encontrados ==="
          find mobile/app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "Nenhum APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-agent-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
