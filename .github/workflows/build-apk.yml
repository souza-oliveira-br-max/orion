  name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK manualmente
        run: |
          set -e
          echo "=== Instalando Android SDK ==="
          
          # Criar diretorio do SDK
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          
          # Baixar command line tools (versao mais recente estavel)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Configurar variaveis
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          # Aceitar licencas e instalar componentes
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          
          echo "=== SDK instalado ==="
          ls -la $HOME/android-sdk/

      - name: Verificar arquivos do mobile
        run: |
          echo "=== mobile/ ==="
          ls -la mobile/
          echo "=== gradle/wrapper/ ==="
          ls -la mobile/gradle/wrapper/
          echo "=== gradlew ==="
          ls -la mobile/gradlew
          
          if [ ! -f mobile/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERRO: gradle-wrapper.jar FALTANDO!"
            exit 1
          fi
          echo "OK: gradle-wrapper.jar existe"

      - name: Criar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties
          cat mobile/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: mobile
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Listar APKs gerados
        run: |
          echo "=== APKs encontrados ==="
          find mobile/app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "Nenhum APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-agent-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
