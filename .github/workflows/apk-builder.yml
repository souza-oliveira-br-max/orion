name: APK Builder

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        run: |
          set -e
          echo "=== Instalando Android SDK ==="
          
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          
          # Caminho absoluto do sdkmanager
          SDKMGR=$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager
          echo "=== Verificando $SDKMGR ==="
          ls -la $SDKMGR
          
          # Aceitar licencas
          yes | $SDKMGR --licenses > /dev/null 2>&1 || true
          
          # Instalar componentes
          $SDKMGR "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          
          # Adicionar ao PATH para proximos steps
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          
          echo "=== SDK instalado ==="
          ls -la $HOME/android-sdk/

      - name: Setup Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > mobile/local.properties
          cat mobile/local.properties
          chmod +x mobile/gradlew

      - name: Build APK
        working-directory: mobile
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orion-agent-apk
          path: mobile/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error